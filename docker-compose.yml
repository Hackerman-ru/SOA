services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      POSTGRES_DB: user_db
    volumes:
      - postgres_data:/var/lib/postgresql/data:rw
    ports:
      - "5432:5432"
    networks:
      - auth_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d user_db -U username" ]
      interval: 10s
      timeout: 5s
      retries: 5

  user_service:
    build: ./user_service
    environment:
      - DATABASE_URL=postgres://username:password@db:5432/user_db
    volumes:
      - ./user_service/signature.pem:/tmp/signature.pem
      - ./user_service/signature.pub:/tmp/signature.pub
    command: [ "--private", "/tmp/signature.pem", "--public", "/tmp/signature.pub", "--kafka", "kafka:9093", "--port", "8081" ]
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    networks:
      - auth_network
      - proxy_network
      - kafka_network
  
  cassandra:
    image: cassandra:latest
    environment:
      - CASSANDRA_START_RPC=true
      - CASSANDRA_RPC_ADDRESS=0.0.0.0
      - CASSANDRA_LISTEN_ADDRESS=auto
      - CASSANDRA_CLUSTER_NAME=my-cluster
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_DC=my-datacenter-1f
    volumes:
      - cassandra_data:/var/lib/cassandra:rw
    ports:
      - "7000:7000"
      - "9042:9042"
    networks:
      - post_network
    healthcheck:
      test: ["CMD-SHELL", "nodetool status"]
      interval: 10s
      timeout: 5s
      retries: 10

  post_service:
    build: ./post_service
    command: ["--cassandra", "cassandra:9042",  "--kafka", "kafka:9093", "--port", "8082"]
    depends_on:
      - cassandra
      - kafka
    ports:
      - "8082:8082"
    networks:
      - post_network
      - proxy_network
      - kafka_network

  proxy_service:
    build: ./proxy_service
    volumes:
      - ./user_service/signature.pub:/tmp/signature.pub
    command: ["--post", "http://post_service:8082","--reaction", "http://reaction_service:8084", "--user", "http://user_service:8081", "--public", "/tmp/signature.pub", "--port", "8080"]
    depends_on:
      - user_service
      - post_service
      - reaction_service
      - kafka
    ports:
      - "8080:8080"
    networks:
      - proxy_network

  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_LISTENERS: CONTROLLER://localhost:9091,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9091
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - kafka_network

  kafka-ui:
    image: kafbat/kafka-ui:main
    ports:
      - "8079:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
    depends_on:
      - kafka
    networks:
      - kafka_network

  clickhouse:
    image: 'clickhouse/clickhouse-server:${CHVER:-latest}'
    user: '101:101'
    container_name: clickhouse
    hostname: clickhouse
    volumes:
      - ./reaction_service/clickhouse/clickhouse-server/config.d/config.xml:/etc/clickhouse-server/config.d/config.xml
      - ./reaction_service/clickhouse/clickhouse-server/users.d/users.xml:/etc/clickhouse-server/users.d/users.xml
      - ./reaction_service/clickhouse/initdb.d:/docker-entrypoint-initdb.d
    ports:
      - '8123:8123'
      - '9000:9000'
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/?query=SELECT%201 || exit 1
    networks:
      - reaction_network

  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.5.1
    hostname: kafka-connect
    depends_on:
      - kafka
      - clickhouse
    environment:
      CONNECT_BOOTSTRAP_SERVERS: "kafka:9093"
      CONNECT_GROUP_ID: "clickhouse-connect"
      CONNECT_CONFIG_STORAGE_TOPIC: "_connect-configs"
      CONNECT_OFFSET_STORAGE_TOPIC: "_connect-offsets"
      CONNECT_STATUS_STORAGE_TOPIC: "_connect-status"
      CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.storage.StringConverter"
      CONNECT_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components,/usr/share/java/clickhouse-kafka-connect"
      CONNECT_REST_ADVERTISED_HOST_NAME: "kafka-connect"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
    volumes:
      - ./reaction_service/kafka-connect/clickhouse-plugin:/usr/share/java/clickhouse-kafka-connect
      - ./reaction_service/kafka-connect/init-connectors.sh:/init-connectors.sh
    command:
      - bash 
      - -c 
      - |
        /etc/confluent/docker/run &
        while ! curl -s http://localhost:8083/connectors >/dev/null; do 
          echo "Waiting for Kafka Connect API..."
          sleep 10
        done
        /init-connectors.sh
        wait
    networks:
      - kafka_network
      - reaction_network

  reaction_service:
    build: ./reaction_service
    command: ["--clickhouse", "http://clickhouse:8123", "--port", "8084"]
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "8084:8084"
    networks:
      - reaction_network
      - proxy_network
      - kafka_network

volumes:
  postgres_data:
  cassandra_data:
  clickhouse-jdbc:

networks:
  auth_network:
  reaction_network:
  post_network:
  proxy_network:
  kafka_network:
