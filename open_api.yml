openapi: 3.0.0
info:
  title: Mailgram API
  version: 1.0.0

servers:
  - url: http://localhost:{port}/api/v1
    description: Локальный сервер разработки
    variables:
      port:
        default: 8080
        description: Порт, на котором запущен сервер.

tags:
  - name: Auth
    description: User authentication
  - name: Profile
    description: User profile management
  - name: Posts
    description: Post management

paths:
  /api/v1/user/register:
    post:
      tags: [Auth]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterData"
      responses:
        "200":
          description: Successfully registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Invalid input

  /api/v1/user/login:
    post:
      tags: [Auth]
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginData"
      responses:
        "200":
          description: Successfully logged in
          headers:
            Set-Cookie:
              schema:
                type: string
                example: jwt=abcde12345; Path=/; HttpOnly
        "401":
          description: Invalid credentials

  /api/v1/user/logout:
    post:
      tags: [Auth]
      summary: User logout
      responses:
        "200":
          description: Successfully logged out
          headers:
            Set-Cookie:
              schema:
                type: string
                example: jwt=; Path=/; HttpOnly; Max-Age=0

  /api/v1/user/profile/my:
    get:
      tags: [Profile]
      summary: Get current user profile
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Profile data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
    put:
      tags: [Profile]
      summary: Update current user profile
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"

  /api/v1/user/profile/{user_id}:
    get:
      tags: [Profile]
      summary: Get user profile by ID
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Profile data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"

  /api/v1/post/create:
    post:
      tags: [Posts]
      summary: Create new post
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostRequest"
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /api/v1/post/update:
    put:
      tags: [Posts]
      summary: Update existing post
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePostRequest"
      responses:
        "200":
          description: Post updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /api/v1/post/get:
    get:
      tags: [Posts]
      summary: Get post details
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
        - name: user_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Post data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /api/v1/post/delete:
    delete:
      tags: [Posts]
      summary: Delete post
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeletePostRequest"
      responses:
        "200":
          description: Post deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /api/v1/post/list:
    get:
      tags: [Posts]
      summary: List posts
      security:
        - cookieAuth: []
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: tags
          in: query
          schema:
            type: array
            items:
              type: string
        - name: page_size
          in: query
          schema:
            type: integer
            default: 10
        - name: page_token
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPostsResponse"

components:
  schemas:
    LoginData:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string

    RegisterData:
      type: object
      required:
        - username
        - password
        - email
      properties:
        username:
          type: string
        password:
          type: string
        email:
          type: string
          format: email

    UserUpdateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          nullable: true
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        phone_number:
          type: string
          nullable: true

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        phone_number:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreatePostRequest:
      type: object
      required:
        - title
        - creator_id
      properties:
        title:
          type: string
        description:
          type: string
        creator_id:
          type: string
          format: uuid
        is_private:
          type: boolean
          default: false
        tags:
          type: array
          items:
            type: string

    UpdatePostRequest:
      type: object
      required:
        - id
        - user_id
      properties:
        id:
          type: string
        user_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        is_private:
          type: boolean
        tags:
          type: array
          items:
            type: string

    DeletePostRequest:
      type: object
      required:
        - id
        - user_id
      properties:
        id:
          type: string
        user_id:
          type: string
          format: uuid

    Post:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        creator_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        is_private:
          type: boolean
        tags:
          type: array
          items:
            type: string

    ListPostsResponse:
      type: object
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        next_page_token:
          type: string

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: jwt
