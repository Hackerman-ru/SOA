syntax = "proto3";

package posts;

service PostService {
  rpc CreatePost(CreatePostRequest) returns (PostResponse);
  rpc GetPost(GetPostRequest) returns (PostResponse);
  rpc UpdatePost(UpdatePostRequest) returns (PostResponse);
  rpc DeletePost(DeletePostRequest) returns (DeletePostResponse);
  rpc ListPosts(ListPostsRequest) returns (ListPostsResponse);
  rpc CommentPost(CommentPostRequest) returns (CommentPostResponse);
  rpc GetComments(GetCommentsRequest) returns (GetCommentsResponse);
  rpc ViewPost(ViewPostRequest) returns (ViewPostResponse);
  rpc LikePost(LikePostRequest) returns (LikePostResponse);
}

message CreatePostRequest {
  string title = 1;
  string description = 2;
  string creator_id = 3;
  bool is_private = 4;
  repeated string tags = 5;
}

message GetPostRequest {
  string id = 1;
  string user_id = 2;
}

message UpdatePostRequest {
  string id = 1;
  string user_id = 2;
  string title = 3;
  string description = 4;
  bool is_private = 5;
  repeated string tags = 6;
}

message DeletePostRequest {
  string id = 1;
  string user_id = 2;
}

message DeletePostResponse { bool success = 1; }

message ListPostsRequest {
  string user_id = 1;
  repeated string tags = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListPostsResponse {
  repeated Post posts = 1;
  string next_page_token = 2;
}

message PostResponse { Post post = 1; }

message ViewPostRequest {
  string post_id = 1;
  string user_id = 2;
}

message ViewPostResponse { bool success = 1; }

message LikePostRequest {
  string post_id = 1;
  string user_id = 2;
}

message LikePostResponse { bool success = 1; }

message CommentPostRequest {
  string post_id = 1;
  string user_id = 2;
  string text = 3;
}

message CommentPostResponse { Comment comment = 1; }

message GetCommentsRequest {
  string post_id = 1;
  string user_id = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message GetCommentsResponse {
  repeated Comment comments = 1;
  string next_page_token = 2;
}

message Comment {
  string id = 1;
  string post_id = 2;
  string user_id = 3;
  string text = 4;
  string created_at = 5;
}

message Post {
  string id = 1;
  string title = 2;
  string description = 3;
  string creator_id = 4;
  string created_at = 5;
  string updated_at = 6;
  bool is_private = 7;
  repeated string tags = 8;
}
