[package]
name = "proxy_service"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.0"
actix-rt = "2.0"
tonic = "0.13"
prost = "0.13"
prost-types = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = "8.3"
awc = "3"
futures = "0.3"
clap = {version = "4.5.23", features = ["derive"]}
uuid = { version = "1.0", features = ["v4", "serde"] }

[build-dependencies]
tonic-build = "*"
